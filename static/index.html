<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>GenAI Recommender</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --acc:#38bdf8; --text:#e2e8f0; --mute:#94a3b8; --tag:#f59e0b; }
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px; }
  h1 { color: var(--acc); margin: 0 0 4px; }
  .sub { color: var(--mute); margin-bottom: 18px; }
  .topbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  input, select, button { padding: 10px 14px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: var(--text); font-size: 14px; }
  input { flex: 1; min-width: 220px; }
  button { background: var(--acc); color: #0f172a; font-weight: 600; cursor: pointer; border: none; }
  button:hover { opacity: 0.85; }
  .layout { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  h2 { color: var(--acc); border-bottom: 1px solid #334155; padding-bottom: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .card { background: var(--card); padding: 14px; border-radius: 10px; border: 1px solid #334155; position: relative; transition: transform .15s; }
  .card:hover { transform: translateY(-2px); border-color: var(--acc); }
  .card .tag { position: absolute; top: 10px; right: 10px; background: var(--tag); color: #1f2937; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .card .cat { color: var(--mute); font-size: 12px; }
  .card .price { color: var(--acc); font-weight: 700; margin: 6px 0; }
  .card .actions { display: flex; gap: 6px; margin-top: 8px; }
  .card .actions button { flex: 1; font-size: 12px; padding: 6px; }
  .ghost { background: transparent !important; color: var(--acc) !important; border: 1px solid var(--acc) !important; }
  .rec { background: linear-gradient(135deg, #1e293b, #0f172a); border-left: 3px solid var(--acc); padding: 12px; margin-bottom: 10px; border-radius: 8px; }
  .rec h4 { margin: 0 0 4px; color: var(--acc); }
  .rec p { margin: 4px 0; font-size: 13px; color: var(--mute); }
  .ctx { background: #0c4a6e; color: #e0f2fe; padding: 8px 12px; border-radius: 6px; font-size: 12px; margin-bottom: 12px; }
  .empty { color: var(--mute); font-style: italic; }
  .cart-item { background: var(--card); padding: 8px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 13px; }
</style>
</head>
<body>

<h1>🛍️ Real-Time GenAI Recommender</h1>
<div class="sub">Click a product, search, or add to cart — recommendations refresh instantly.</div>

<div class="topbar">
  <input id="searchBox" placeholder="🔍 Search e.g. 'running fitness gear', 'cold weather'" />
  <select id="tone">
    <option value="casual">Casual tone</option>
    <option value="premium">Premium tone</option>
    <option value="budget">Budget tone</option>
  </select>
  <button onclick="doSearch()">Search</button>
</div>

<div class="layout">
  <div>
    <h2>🛒 Products</h2>
    <div id="products" class="grid"></div>
  </div>
  <div>
    <h2>✨ Recommended For You</h2>
    <div id="ctx" class="ctx empty">No activity yet — click any product to start.</div>
    <div id="recs"></div>

    <h2 style="margin-top:24px;">🧺 Your Cart</h2>
    <div id="cart"><div class="empty">Cart is empty</div></div>
  </div>
</div>

<script>
function getUserId() {
  let id = localStorage.getItem("rec_user_id");
  if (!id) {
    id = "user_" + Math.random().toString(36).slice(2, 10);
    localStorage.setItem("rec_user_id", id);
  }
  return id;
}
const USER_ID = getUserId();

async function loadProducts() {
  const res = await fetch("/products");
  const data = await res.json();
  renderProducts(data.products);
}

function renderProducts(list) {
  const el = document.getElementById("products");
  el.innerHTML = list.map(p => `
    <div class="card">
      <span class="tag">${p.tag}</span>
      <h3>${p.name}</h3>
      <div class="cat">${p.category}</div>
      <div class="price">₹${p.price}</div>
      <div class="actions">
        <button onclick="trackEvent(${p.id}, 'view')">View</button>
        <button class="ghost" onclick="trackEvent(${p.id}, 'add_to_cart')">Add to Cart</button>
      </div>
    </div>
  `).join("");
}

async function trackEvent(productId, action) {
  const tone = document.getElementById("tone").value;
  const res = await fetch("/track", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ user_id: USER_ID, product_id: productId, action, tone })
  });
  const data = await res.json();
  renderRecs(data);
  if (action === "add_to_cart") loadCart();
}

async function doSearch() {
  const query = document.getElementById("searchBox").value.trim();
  if (!query) return;
  const tone = document.getElementById("tone").value;
  const res = await fetch("/search", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ user_id: USER_ID, query, tone })
  });
  const data = await res.json();
  if (data.results) renderProducts(data.results);
  renderRecs(data);
}

function renderRecs(data) {
  document.getElementById("ctx").classList.remove("empty");
  document.getElementById("ctx").innerText = "📍 " + data.user_context;

  const recs = data.recommendations || [];
  const el = document.getElementById("recs");
  if (recs.length === 0) {
    el.innerHTML = '<div class="empty">No recommendations yet.</div>';
    return;
  }
  el.innerHTML = recs.map(r => `
    <div class="rec">
      <h4>${r.name} <span class="tag" style="position:static;">${r.tag}</span></h4>
      <p><b>${r.category}</b> • ₹${r.price}</p>
      <p>💡 ${r.explanation}</p>
    </div>
  `).join("");
}

async function loadCart() {
  const res = await fetch(`/cart/${USER_ID}`);
  const data = await res.json();
  const el = document.getElementById("cart");
  if (!data.cart.length) { el.innerHTML = '<div class="empty">Cart is empty</div>'; return; }
  el.innerHTML = data.cart.map(p => `<div class="cart-item">🛒 ${p.name} — ₹${p.price}</div>`).join("");
}

// Search on Enter
document.getElementById("searchBox").addEventListener("keypress", e => {
  if (e.key === "Enter") doSearch();
});

loadProducts();
</script>
</body>
</html>
